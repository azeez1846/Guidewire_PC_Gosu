version: '3.8'

services:
  vehicledetails-ig:
    build:
      context: ../vehicledetails_IG
      dockerfile: Dockerfile
    container_name: vehicledetails_ig_service
    ports:
      - "8088:8080"
    networks:
      - gw-ig-network
    restart: always

  addressstandardization-ig:
    build:
      context: ../addressstandardization_IG
      dockerfile: Dockerfile
    container_name: addressstandardization_ig_service
    ports:
      - "8089:8080"
    networks:
      - gw-ig-network
    restart: always

  creditfraud-ig:
    build:
      context: ../creditfraud_IG
      dockerfile: Dockerfile
    container_name: creditfraud_ig_service
    ports:
      - "8090:8090"
    networks:
      - gw-ig-network
    restart: always

  telematics-ig:
    build:
      context: ../telematics_IG
      dockerfile: Dockerfile
    container_name: telematics_ig_service
    ports:
      - "8091:8091"
    networks:
      - gw-ig-network
    restart: always

  guidewire-policycenter:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: guidewire_policycenter_app
    ports:
      - "8085:8085"
      - "8082:8082"
    environment:
      - VEHICLE_IG_HOST=vehicledetails-ig
      - VEHICLE_IG_PORT=8088
      - ADDRESS_IG_HOST=addressstandardization-ig
      - ADDRESS_IG_PORT=8089
      - CREDIT_IG_HOST=creditfraud-ig
      - CREDIT_IG_PORT=8090
      - TELEMATICS_IG_HOST=telematics-ig
      - TELEMATICS_IG_PORT=8091
    depends_on:
      - vehicledetails-ig
      - addressstandardization-ig
      - creditfraud-ig
      - telematics-ig
    volumes:
      - ./data:/app/data
    networks:
      - gw-ig-network
    restart: always

networks:
  gw-ig-network:
    driver: bridge
