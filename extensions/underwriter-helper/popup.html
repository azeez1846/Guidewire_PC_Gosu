<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Underwriter Assistant</title>
  <style>
    body { width: 340px; margin: 0; padding: 16px; font-family: 'Segoe UI', system-ui, sans-serif; background: #0F172A; color: #F8FAFC; font-size: 13px; }
    h2 { font-size: 16px; margin-top: 0; margin-bottom: 12px; color: #38BDF8; display: flex; align-items: center; justify-content: space-between; }
    .card { background: #1E293B; border-radius: 8px; padding: 12px; border: 1px solid rgba(255,255,255,0.1); margin-bottom: 12px; }
    input { width: 100%; box-sizing: border-box; padding: 8px 10px; border-radius: 6px; border: 1px solid #334155; background: #0F172A; color: #FFF; font-size: 13px; margin-bottom: 8px; }
    button { width: 100%; background: linear-gradient(135deg, #0284C7, #4F46E5); color: #FFF; border: none; padding: 8px 12px; border-radius: 6px; font-weight: 600; cursor: pointer; }
    button:hover { opacity: 0.9; }
    #result { white-space: pre-wrap; font-family: monospace; font-size: 11px; color: #A7F3D0; margin-top: 8px; max-height: 140px; overflow-y: auto; background: #090D16; padding: 8px; border-radius: 4px; }
    .badge { font-size: 10px; padding: 2px 6px; border-radius: 4px; background: #0284C7; color: #FFF; }
  </style>
</head>
<body>
  <h2><span>🛡️ PC Assistant</span> <span class="badge">v1.0</span></h2>
  
  <div class="card">
    <label style="color:#94A3B8; font-size:11px;">ENTER VIN / POLICY # / ACCOUNT #:</label>
    <input type="text" id="searchInput" placeholder="e.g. 1G123456789012345 or POL-849102">
    <button id="searchBtn">🔍 Query PolicyCenter API</button>
  </div>

  <div class="card">
    <label style="color:#94A3B8; font-size:11px;">QUICK RUNNERS:</label>
    <button id="triageBtn" style="background:linear-gradient(135deg, #8B5CF6, #6366F1); margin-bottom:6px;">🤖 Run AI Underwriting Triage</button>
    <button id="gqlBtn" style="background:linear-gradient(135deg, #10B981, #059669);">⚡ Run Live GraphQL Policy Query</button>
  </div>

  <div id="result">Ready for query execution...</div>

  <script src="popup.js"></script>
</body>
</html>
